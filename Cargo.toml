[package]
name = "copilot-gateway"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Expose GitHub Copilot CLI (copilot --acp) as Anthropic and OpenAI compatible HTTP APIs, and run Claude Code or Codex CLI on a Copilot subscription"
license = "MIT"
repository = "https://github.com/phimage/copilot-gateway"
readme = "README.md"
keywords = ["copilot", "acp", "anthropic", "openai", "proxy"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }
which = "8.0.6"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
